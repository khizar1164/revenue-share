<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claims</title>
<style>
  /* The claims, on their own screen.
   *
   * Andrew, 3 November, wanted them on the break-room wall so the crew can
   * see "where we have more room for improvement". On 6 November he said what
   * that should look like: "For claims can we include job numbers, dates,
   * amounts, and the code names for the crew that was on the job?"
   *
   * It led with a generated tip until he asked for that to come off -- "until
   * I can provide better instructions on that" -- so this is the list itself,
   * read as a record rather than as a lesson. The tip machinery is still
   * there behind CLAIM_TIPS and the row has a place for one.
   *
   * Built for one 1920x1080 screen read from across a room, and scaled to
   * whatever it lands on, the same way tv.html does it.
   */
  :root{
    --plane:#111214; --ink:#f6f4f1; --ink-2:#cfcbc4; --ink-3:#8b867e;
    --seam:#26282c; --rule:#1c1e21; --crit:#ff5500; --good:#39b06a;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --head:"Segoe UI Semibold",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--plane);color:var(--ink-2);
    font-family:var(--sans);overflow:hidden}
  #wrap{width:100vw;height:100vh;overflow:hidden}
  #page{width:1920px;height:1080px;transform-origin:top left;padding:26px 44px;
    display:flex;flex-direction:column;gap:18px;background:var(--plane)}

  .top{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--seam);padding-bottom:14px}
  .brand{font-family:var(--head);font-size:30px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--ink)}
  .brand em{color:var(--crit);font-style:normal}
  .title{margin-left:20px;font-size:27px;color:var(--ink-3)}
  .clock{font-family:var(--head);font-size:30px;color:var(--ink)}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{font-family:var(--head);font-size:20px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--ink-3);text-align:left;
    padding:0 0 12px;font-weight:600}
  tbody td{padding:15px 0;border-top:1px solid var(--rule);
    font-size:27px;color:var(--ink-2);vertical-align:top}
  /* Fixed widths so the columns line up down the page and the eye can run
     straight down the amounts, which is the column that matters. */
  .cDate{width:118px} .cJob{width:132px} .cAmt{width:158px;text-align:right}
  .cCrew{width:430px}
  td.cAmt{color:var(--crit);font-weight:700;font-variant-numeric:tabular-nums}
  td.cDate{color:var(--ink-3)}
  td.cJob{color:var(--ink-3);font-variant-numeric:tabular-nums}
  td.cWhat{padding-right:40px;color:var(--ink)}
  td.cCrew{color:var(--ink-2);font-size:25px}
  .none{color:var(--ink-3);font-style:italic}
  .tip{display:block;margin-top:7px;font-size:22px;color:var(--ink-3)}

  .foot{margin-top:auto;display:flex;justify-content:space-between;
    font-size:21px;color:var(--ink-3);
    border-top:2px solid var(--seam);padding-top:13px}

  /* Nothing to show is good news and should read like it, not like a page
     that failed to load. */
  .clear{font-size:52px;color:var(--good);font-weight:600;padding:80px 0}
  #err{position:fixed;left:0;right:0;bottom:0;background:#3a1d14;color:#ffd9c7;
    font-size:20px;padding:10px 20px;display:none}
</style>
</head>
<body>

<div id="wrap"><div id="page">
  <div class="top">
    <div><span class="brand">Immediate Movers <em>&amp;</em> Storage</span>
         <span class="title">Claims</span></div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div id="body"></div>

  <div class="foot">
    <span id="foot"></span>
    <span id="stamp"></span>
  </div>
</div></div>
<div id="err"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  };
  var usd = function (n) {
    return "$" + Number(n || 0).toLocaleString("en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  /* The token is in the path, never a query string, where it would end up in
     a log: /claims/:token, or /learning/:token which is the older name. */
  var TOKEN = location.pathname.split("/").filter(Boolean).pop() || "";

  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    var p = $("page");
    p.style.transform = "scale(" + s + ")";
    p.style.marginLeft = Math.max(0, (innerWidth - 1920 * s) / 2) + "px";
  }
  addEventListener("resize", fit);

  function clock() {
    var n = new Date(), h = n.getHours(), m = n.getMinutes();
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    $("clock").textContent = h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }

  function render(L) {
    var rows = (L && L.claims) || [];
    if (!rows.length) {
      $("body").innerHTML = '<div class="clear">No claims on record. Nothing to put right.</div>';
      $("foot").textContent = "";
      return;
    }

    $("body").innerHTML =
      '<table><thead><tr>'
      + '<th class="cDate">Date</th><th class="cJob">Job</th>'
      + '<th>What happened</th>'
      + '<th class="cCrew">Crew on the job</th>'
      + '<th class="cAmt">Amount</th>'
      + '</tr></thead><tbody>'
      + rows.map(function (c) {
          /* No crew is said rather than left blank. A gap in a table reads as
             a bug; "not recorded" reads as what it is, which for anything
             entered before the crew picker existed is simply the truth. */
          var who = (c.crew && c.crew.length)
            ? esc(c.crew.join(", "))
            : '<span class="none">not recorded</span>';
          return '<tr>'
            + '<td class="cDate">' + esc(c.on_day) + '</td>'
            + '<td class="cJob">' + (c.job_number ? esc(c.job_number) : "&mdash;") + '</td>'
            + '<td class="cWhat">' + esc(c.reason)
            + (c.tip ? '<span class="tip">' + esc(c.tip) + '</span>' : "")
            + '</td>'
            + '<td class="cCrew">' + who + '</td>'
            + '<td class="cAmt">' + usd(c.amount) + '</td>'
            + '</tr>';
        }).join("")
      + '</tbody></table>';

    var shown = rows.length, total = L.total || shown;
    $("foot").textContent = total > shown
      ? "Showing the " + shown + " most recent of " + total + " claims."
      : total + (total === 1 ? " claim on record." : " claims on record.");
    fit();
  }

  var failures = 0;
  function load() {
    fetch("/api/board/" + encodeURIComponent(TOKEN), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        failures = 0;
        $("err").style.display = "none";
        render(d.learning);
        $("stamp").textContent = "updated " + new Date().toLocaleTimeString(undefined,
          { hour: "numeric", minute: "2-digit" });
      })
      .catch(function (e) {
        /* One bad request must not blank a wall. The page keeps what it last
           showed and only says anything after it has failed repeatedly: a
           screen that flickers an error every minute teaches people to stop
           looking at it. */
        if (++failures >= 3) {
          $("err").textContent = "Cannot reach the server (" + e.message + "). Showing the last update.";
          $("err").style.display = "block";
        }
      });
  }

  clock(); fit(); load();
  setInterval(clock, 15000);
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
