<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Immediate Movers — Revenue Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* The front door. It deliberately links to nothing secret — the break-room
     board lives at an unguessable address, and this page must never give it
     away. Two doors only: your own report, and the admin panel. */
  :root{
    --plane:#100f0d; --panel:#1a1815; --seam:#2e2a24;
    --ink:#fff; --ink-2:#c9c3b6; --ink-3:#8b857a; --brand:#f0762e;
    --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--plane);color:var(--ink-2);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:100%;max-width:440px;text-align:center}
  .mark{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  h1{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;letter-spacing:.03em;
    text-transform:uppercase;color:var(--ink);margin:0 0 12px}
  h1 em{color:var(--brand);font-style:normal}
  p{font-size:16px;margin:0 0 30px;line-height:1.5}
  .doors{display:grid;gap:12px}
  a.door{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--seam);
    border-radius:12px;padding:18px 20px;text-align:left;transition:border-color .15s,transform .15s}
  a.door:hover,a.door:focus-visible{border-color:var(--brand);transform:translateY(-1px);outline:none}
  a.door.primary{background:var(--brand);border-color:var(--brand)}
  a.door .t{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink)}
  a.door.primary .t{color:#1a0e05}
  a.door .s{font-size:14px;color:var(--ink-3);margin-top:3px}
  a.door.primary .s{color:#4a2a10}
  footer{margin-top:34px;font-size:12.5px;color:var(--ink-3)}
</style>
</head>
<body>
<main>
  <div class="mark">Immediate Movers <span style="color:var(--brand)">&amp;</span> Storage</div>
  <h1>Revenue <em>Share</em></h1>
  <p>See what you've earned this month — your points, your reviews, and your share of the pool.</p>

  <nav class="doors">
    <a class="door primary" href="/me">
      <div class="t">My revenue share</div>
      <div class="s">Sign in with your work email</div>
    </a>
    <a class="door" href="/admin">
      <div class="t">Admin</div>
      <div class="s">Andrew and Nicole</div>
    </a>
  </nav>

  <footer>Private to the crew of Immediate Movers &amp; Storage.</footer>
</main>
</body>
</html>
