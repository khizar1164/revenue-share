# Render blueprint.
#
# One always-on web service beside the Postgres that is already there. The
# scheduler runs inside it rather than as separate cron services — the process
# is up anyway, and one process means one set of logs and nothing extra to pay
# for.
#
# The free plan is not an option here: it sleeps after fifteen minutes of quiet,
# which would leave the break-room TV on a loading screen for most of the day.

services:
  - type: web
    name: revenue-share
    # Docker, since 9 October, for one reason: the disciplinary write-up is
    # printed by Chrome, and Matthew needs a button rather than somebody to ask.
    # See the Dockerfile.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter                  # always on — see above
    region: oregon                 # same region as immediate-movers-db
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Turns the background jobs on. Off everywhere else so a local run never
      # starts hitting SmartMoving or rewriting Andrew's sheet.
      - key: RUN_SCHEDULER
        value: "on"

      # Andrew approved crew sign-in emails on 8 October 2026. Before that this
      # was "off", and absent counts as off too — which is why nothing had ever
      # reached a crew member by accident.
      - key: SEND_EMAILS
        value: "on"

      # A second, independent stop: while this is set, only these addresses can
      # receive anything at all. Emptied on 8 October so the crew can request
      # their own sign-in links. Put an address back in it to shut sending down
      # to one person again without touching SEND_EMAILS.
      - key: MAIL_ALLOWLIST
        value: ""

      # The report page must not let a URL decide who you are once it is public.
      - key: ALLOW_REPORT_PREVIEW
        value: "off"

      # Connecteam raises a task for Matthew when somebody crosses 15, 30 or 45
      # lost points. Off until somebody says start: the discipline check runs
      # either way and records every crossing, so switching this on later does
      # not mean the weeks before it went unwatched.
      - key: CONNECTEAM_TASKS
        value: "off"

      # Andrew, 6 October: 'Quick Task label "Human Resources"'. It is also the
      # label already on the quick tasks Matthew gets today, so a write-up lands
      # where he is used to looking. No board is named because the account has
      # exactly one, "Task Management", and everything is filed by label.
      - key: CONNECTEAM_LABEL
        value: Human Resources
      - key: CONNECTEAM_ASSIGNEE_EMAIL
        value: matthewb@immediatemoversnwi.com

      # New movers come across from Connecteam hourly. The department is the
      # rule: everybody on the dashboard is in Operations and the office is
      # not, so Andrew decides who is a mover where he already decides it.
      - key: CONNECTEAM_CREW_GROUP
        value: Operations

      - key: TIMEZONE
        value: America/Chicago     # La Porte is Central, unlike most of Indiana

      - key: SHEET_ID
        value: 1cHxgw2eoKJy9TTzAfLOBJqodaA11_V-l29Hdey1uUz8

      - key: MAIL_FROM
        value: Immediate Movers <revenue-share@share.immediatemover.com>

      # Internal connection string — never leaves Render's network, and lets
      # external access to the database be switched off entirely.
      - key: DATABASE_URL
        fromDatabase:
          name: immediate-movers-db
          property: connectionString

      # Set by hand in the dashboard, not here. Values in this file end up in
      # the repository.
      - key: PUBLIC_URL
        sync: false
      - key: TV_TOKEN
        sync: false
      - key: SMARTMOVING_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CONNECTEAM_API_KEY
        sync: false
